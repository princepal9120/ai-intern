  <path d="M 400 558 Q 418 568 400 585" fill="none" stroke="#2DD4BF" stroke-width="4"/>
  <text x="380" y="578" font-family="'Bangers', sans-serif" font-size="14" fill="#2DD4BF" text-anchor="middle">AI</text>
