  <ellipse cx="600" cy="345" rx="55" ry="40" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
  <path d="M 590 325 C 585 325 580 332 585 340 C 592 348 608 348 615 340 C 620 332 615 325 590 325 Z" fill="#111111"/>
