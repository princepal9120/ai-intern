  <rect x="800" y="265" width="260" height="18" rx="4" fill="#EF4444" opacity="0.2"/>
  <text x="810" y="278" font-family="'DM Mono', monospace" font-size="10" fill="#F87171">- router.post('/auth', legacyLoginHandler)</text>
