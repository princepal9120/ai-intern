  <text x="810" y="303" font-family="'DM Mono', monospace" font-size="10" fill="#4ADE80">+ router.post('/auth', rateLimit, safeLogin)</text>
  <text x="810" y="335" font-family="'DM Mono', monospace" font-size="10" fill="#94A3B8">✓ Sandbox isolation: verified</text>
  <text x="810" y="355" font-family="'DM Mono', monospace" font-size="10" fill="#94A3B8">✓ 203 unit tests passed</text>
  <text x="810" y="375" font-family="'DM Mono', monospace" font-size="10" fill="#2DD4BF">✓ All checks passed · Ready to merge</text>

