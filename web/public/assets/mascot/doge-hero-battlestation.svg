  <line x1="170" y1="350" x2="270" y2="325" stroke="#2DD4BF" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="350" x2="270" y2="375" stroke="#2DD4BF" stroke-width="2" opacity="0.6"/>
  <line x1="170" y1="400" x2="270" y2="375" stroke="#2DD4BF" stroke-width="2" opacity="0.6"/>
  <line x1="270" y1="325" x2="370" y2="350" stroke="#0EA5E9" stroke-width="2.5" opacity="0.8"/>
