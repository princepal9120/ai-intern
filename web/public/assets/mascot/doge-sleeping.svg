<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sleepFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89B3D"/>
      <stop offset="100%" stop-color="#B86616"/>
    </linearGradient>
  </defs>
  <!-- Curled up body -->
  <ellipse cx="80" cy="65" rx="55" ry="30" fill="url(#sleepFur)" stroke="#000000" stroke-width="6"/>
  <!-- Shiba tail curled -->
  <path d="M 28 65 Q 18 45 35 40 Q 45 42 40 55" fill="#FFE8C7" stroke="#000000" stroke-width="5"/>
  <!-- Head resting -->
  <circle cx="115" cy="55" r="28" fill="url(#sleepFur)" stroke="#000000" stroke-width="6"/>
  <!-- Ear flat -->
  <path d="M 95 40 L 80 25 Q 98 25 105 38 Z" fill="#D68326" stroke="#000000" stroke-width="5"/>
  <path d="M 120 35 L 135 18 Q 142 30 135 40 Z" fill="#D68326" stroke="#000000" stroke-width="5"/>
  <!-- White muzzle -->
  <ellipse cx="125" cy="62" rx="14" ry="10" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
  <!-- Nose -->
  <ellipse cx="132" cy="58" rx="4" ry="3" fill="#111111"/>
  <!-- Happy closed sleepy eye -->
  <path d="M 108 52 Q 115 58 122 52" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <!-- Little ZZZ -->
  <text x="135" y="25" font-family="Bangers, sans-serif" font-size="16" font-weight="bold" fill="#2DD4BF">z</text>
  <text x="145" y="16" font-family="Bangers, sans-serif" font-size="20" font-weight="bold" fill="#2DD4BF">Z</text>
</svg>