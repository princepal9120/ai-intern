<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 350" width="100%" height="100%">
  <!-- Doge back view climbing up comic border -->
  <defs>
    <linearGradient id="climbFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E89B3D"/>
      <stop offset="100%" stop-color="#B86616"/>
    </linearGradient>
  </defs>
  <!-- Climbing paws reaching up -->
  <ellipse cx="90" cy="50" rx="18" ry="14" fill="#FFFFFF" stroke="#000000" stroke-width="7"/>
  <ellipse cx="210" cy="50" rx="18" ry="14" fill="#FFFFFF" stroke="#000000" stroke-width="7"/>
  <!-- Claws -->
  <line x1="82" y1="42" x2="82" y2="35" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="40" x2="90" y2="33" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="98" y1="42" x2="98" y2="35" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="202" y1="42" x2="202" y2="35" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="210" y1="40" x2="210" y2="33" stroke="#000000" stroke-width="4" stroke-linecap="round"/>
  <line x1="218" y1="42" x2="218" y2="35" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Head turned slightly -->
  <circle cx="150" cy="110" r="55" fill="url(#climbFur)" stroke="#000000" stroke-width="9"/>
  <!-- Ears perked -->
  <path d="M 105 85 L 85 35 Q 115 45 125 75 Z" fill="#D68326" stroke="#000000" stroke-width="7"/>
  <path d="M 195 85 L 215 35 Q 185 45 175 75 Z" fill="#D68326" stroke="#000000" stroke-width="7"/>

  <!-- Sunglasses seen from side/angle -->
  <rect x="155" y="95" width="40" height="24" rx="6" fill="#3FA5EB" stroke="#000000" stroke-width="5"/>
  <line x1="165" y1="98" x2="175" y2="114" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Chubby Body hanging down -->
  <path d="M 105 150 Q 80 230 110 270 Q 150 295 190 270 Q 220 230 195 150 Z" fill="url(#climbFur)" stroke="#000000" stroke-width="9"/>
  <!-- Little bottom paws -->
  <ellipse cx="105" cy="285" rx="16" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
  <ellipse cx="195" cy="285" rx="16" ry="12" fill="#FFFFFF" stroke="#000000" stroke-width="6"/>
  <!-- Curled fluffy Shiba tail -->
  <path d="M 150 240 Q 180 220 170 190 Q 150 185 145 210" fill="#FFE8C7" stroke="#000000" stroke-width="7"/>
  <!-- Sweat drop (climbing effort!) -->
  <path d="M 220 100 Q 235 90 230 115 Q 220 120 220 100 Z" fill="#5EEAD4" stroke="#000000" stroke-width="3"/>
</svg>