<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89B3D"/>
      <stop offset="50%" stop-color="#D68326"/>
      <stop offset="100%" stop-color="#B86616"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF2DC"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72CEF9"/>
      <stop offset="50%" stop-color="#3FA5EB"/>
      <stop offset="100%" stop-color="#1B6DBF"/>
    </linearGradient>
    <filter id="comicShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="6" dy="6" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Comic Card Frame (matching reference panel) -->
  <rect x="25" y="25" width="450" height="450" rx="45" ry="45" fill="#FFFFFF" stroke="#000000" stroke-width="16" />

  <!-- Manga Speed / Action Lines (Top Left, identical to reference) -->
  <g stroke="#000000" stroke-width="8" stroke-linecap="round">
    <line x1="60" y1="50" x2="135" y2="140" stroke-width="9" />
    <line x1="85" y1="50" x2="155" y2="135" stroke-width="8" />
    <line x1="110" y1="50" x2="175" y2="130" stroke-width="7" />
    <line x1="135" y1="50" x2="195" y2="120" stroke-width="6" />
    <line x1="165" y1="50" x2="215" y2="110" stroke-width="6" />
    <line x1="195" y1="50" x2="235" y2="98" stroke-width="5" />
    <line x1="230" y1="50" x2="255" y2="85" stroke-width="5" />
  </g>

  <!-- Doge / Shiba Head & Body Silhouette -->
  <!-- Left Ear (Back) -->
  <path d="M 125 150 L 160 50 Q 185 85 210 125 Z" fill="#D68326" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
  <path d="M 145 130 L 168 75 Q 182 98 195 125 Z" fill="#FFE8C7" stroke="#000000" stroke-width="6" />

  <!-- Right Ear (Front) -->
  <path d="M 285 110 L 375 40 Q 380 90 350 145 Z" fill="#E89B3D" stroke="#000000" stroke-width="14" stroke-linejoin="round" />
  <path d="M 305 105 L 360 65 Q 362 98 335 135 Z" fill="#FFE8C7" stroke="#000000" stroke-width="7" />

  <!-- Main Head & Neck Base -->
  <path d="M 110 320 Q 90 220 160 145 Q 225 110 320 135 Q 400 170 415 260 Q 425 330 380 390 Q 340 450 250 460 Q 140 465 110 320 Z" 
        fill="url(#furGrad)" stroke="#000000" stroke-width="14" stroke-linejoin="round" />

  <!-- Shiba White/Cream Muzzle & Cheek Fluff -->
  <path d="M 170 300 Q 180 230 250 220 Q 330 220 370 270 Q 410 320 375 390 Q 320 440 230 430 Q 160 410 170 300 Z" 
        fill="url(#creamGrad)" stroke="#000000" stroke-width="10" />

  <!-- Famous Shiba Eyebrow Dots -->
  <ellipse cx="210" cy="165" rx="14" ry="11" fill="#FFF2DC" stroke="#000000" stroke-width="5" />
  <ellipse cx="325" cy="155" rx="14" ry="11" fill="#FFF2DC" stroke="#000000" stroke-width="5" />

  <!-- Sunglasses Black Strap -->
  <path d="M 105 235 Q 150 220 200 215" stroke="#111111" stroke-width="16" stroke-linecap="round" />
  <path d="M 370 210 Q 405 220 425 245" stroke="#111111" stroke-width="16" stroke-linecap="round" />

  <!-- Cool Sunglasses Black Frame -->
  <!-- Left Lens -->
  <rect x="180" y="195" width="85" height="75" rx="18" fill="#111111" stroke="#000000" stroke-width="8" />
  <rect x="186" y="201" width="73" height="63" rx="12" fill="url(#glassGrad)" />

  <!-- Right Lens -->
  <rect x="285" y="190" width="95" height="78" rx="18" fill="#111111" stroke="#000000" stroke-width="8" />
  <rect x="291" y="196" width="83" height="66" rx="12" fill="url(#glassGrad)" />

  <!-- Bridge -->
  <path d="M 265 225 Q 285 220 285 225" stroke="#111111" stroke-width="14" stroke-linecap="round" />

  <!-- Sunglasses Glossy Glare Stripes (Signature Manga look) -->
  <polygon points="195,260 215,205 225,205 205,260" fill="#FFFFFF" opacity="0.85" />
  <polygon points="228,260 238,225 244,225 234,260" fill="#FFFFFF" opacity="0.6" />

  <polygon points="305,255 330,200 342,200 317,255" fill="#FFFFFF" opacity="0.85" />
  <polygon points="345,255 358,220 365,220 352,255" fill="#FFFFFF" opacity="0.6" />

  <!-- Cute Shiba Black Nose -->
  <path d="M 270 315 C 260 315 252 325 258 335 C 265 348 290 348 296 335 C 302 325 290 315 270 315 Z" fill="#1A1A1A" stroke="#000000" stroke-width="5" />
  <ellipse cx="268" cy="322" rx="4" ry="2" fill="#FFFFFF" />

  <!-- Doge Smile / W-mouth -->
  <path d="M 276 342 L 276 355" stroke="#000000" stroke-width="7" stroke-linecap="round" />
  <path d="M 245 355 Q 265 372 276 355 Q 295 372 315 355" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" />

  <!-- Manga Cheek Whiskers & Ink Hatching -->
  <g stroke="#000000" stroke-width="5" stroke-linecap="round">
    <line x1="365" y1="360" x2="385" y2="380" />
    <line x1="375" y1="350" x2="400" y2="370" />
    <line x1="385" y1="340" x2="410" y2="358" />
  </g>
</svg>